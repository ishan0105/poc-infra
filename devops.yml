AWSTemplateFormatVersion: '2010-09-09'
Description: API Gateway without any methods

Parameters:
  BranchName:
    Description: Branch name
    Type: String
    Default: "v1"

Resources:

  CodeBuildRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - 'sts:AssumeRole'
            Principal:
              Service:
                - 'codebuild.amazonaws.com'
            Effect: Allow
        Version: 2012-10-17
      Description: Grant AWS services access to Code Build
      Path: /
      Policies:
        - PolicyName: zero-downtime-poc-code-build-admin-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action: '*'
                Effect: Allow
                Resource: '*'
      RoleName: 'zero-downtime-poc-code-build-role'
      Tags:
        - Key: 'zero-downtime-poc-code-build-role'
          Value: 'zero-downtime-poc-code-build-role'

  CodePipelineRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - 'sts:AssumeRole'
            Effect: Allow
            Principal:
              Service:
                - 'codepipeline.amazonaws.com'
        Version: '2012-10-17'
      Path: /
      Policies:
        - PolicyName: zero-downtime-poc-code-pipeline-admin-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - '*'
                Effect: Allow
                Resource: '*'
      RoleName: 'zero-downtime-poc-code-pipeline-role'
      Tags:
        - Key: 'zero-downtime-poc-code-pipeline-role'
          Value: 'zero-downtime-poc-code-pipeline-role'

  CloudFormationRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - 'sts:AssumeRole'
            Effect: Allow
            Principal:
              Service:
                - 'cloudformation.amazonaws.com'
        Version: '2012-10-17'
      Path: '/'
      Policies:
        - PolicyName: zero-downtime-poc-cloud-formation-admin-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action: '*'
                Effect: Allow
                Resource: '*'
      RoleName: 'zero-downtime-poc-cloud-formation-role'
      Tags:
        - Key: 'zero-downtime-poc-cloud-formation-role'
          Value: 'zero-downtime-poc-cloud-formation-role'

  SSMCodePipelineRole:
    Type: "AWS::SSM::Parameter"
    Properties:
      Type: String
      Description: !Sub "Code Pipeline Role ARN"
      Value: !GetAtt CodePipelineRole.Arn
      Name: "/zero-downtime-poc/codepipelinerole/arn"

  CloudFormationPackageS3Bucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName: zero-downtime-poc-cloudformation-scripts
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - ExpirationInDays: 1
            NoncurrentVersionExpirationInDays: 1
            Status: Enabled

  SSMCloudFormationBucket:
    DependsOn: CloudFormationPackageS3Bucket
    Type: 'AWS::SSM::Parameter'
    Properties:
      Type: String
      Description: !Sub 'Value of S3 bucket cloudformation-scripts'
      Value: !Ref CloudFormationPackageS3Bucket
      Name: '/zero-downtime-poc/s3/cloudformation-scripts'
         
  ArtifactStoreS3Bucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName: zero-downtime-poc-devops-artifact
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - ExpirationInDays: 1
            NoncurrentVersionExpirationInDays: 1
            Status: Enabled

  SSMArtifactBucket:
    DependsOn: ArtifactStoreS3Bucket
    Type: 'AWS::SSM::Parameter'
    Properties:
      Type: String
      Value: !Ref ArtifactStoreS3Bucket
      Name: '/zero-downtime-poc/s3/devops-artifacts'

  SSMArtifactBucketArn:
    DependsOn: ArtifactStoreS3Bucket
    Type: 'AWS::SSM::Parameter'
    Properties:
      Type: String
      Description: !Sub 'Arn of S3 bucket for DevOps artifacts'
      Value: !GetAtt ArtifactStoreS3Bucket.Arn
      Name: '/zero-downtime-poc/s3/devops-artifacts/arn'

  smoketestS3Bucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName: zero-downtime-poc-smoketest-script
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - ExpirationInDays: 1
            NoncurrentVersionExpirationInDays: 1
            Status: Enabled

  databaseS3Bucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName: zero-downtime-poc-database
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - ExpirationInDays: 1
            NoncurrentVersionExpirationInDays: 1
            Status: Enabled

